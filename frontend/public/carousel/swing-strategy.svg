<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030073;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Entry Zone -->
  <rect x="100" y="280" width="300" height="40" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="250" y="310" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">GİRİŞ ZONE</text>

  <!-- Price Level -->
  <line x1="50" y1="260" x2="600" y2="260" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="265" fill="#3b82f6" font-size="12">$105-$107.72</text>

  <!-- Stop Loss -->
  <line x1="50" y1="420" x2="600" y2="420" stroke="#ef4444" stroke-width="2"/>
  <text x="620" y="425" fill="#ef4444" font-size="12">STOP: $102.10</text>

  <!-- Target Levels -->
  <line x1="50" y1="140" x2="600" y2="140" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="145" fill="#3b82f6" font-size="11">TP1: $112.18 (1.1x)</text>

  <line x1="50" y1="100" x2="600" y2="100" stroke="#06b6d4" stroke-width="2"/>
  <text x="620" y="105" fill="#06b6d4" font-size="11">TP2: $117.53 (2.3x)</text>

  <line x1="50" y1="60" x2="600" y2="60" stroke="#8b5cf6" stroke-width="2"/>
  <text x="620" y="65" fill="#8b5cf6" font-size="11">TP3: $122.87 (3.4x)</text>

  <!-- Risk % Badge -->
  <rect x="650" y="450" width="120" height="60" fill="none" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="710" y="475" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Risk %</text>
  <text x="710" y="500" text-anchor="middle" fill="#f59e0b" font-size="18" font-weight="bold">5.00%</text>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Swing Trade Stratejisi</text>
</svg>