<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030073;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg1)"/>

  <!-- Grid -->
  <line x1="50" y1="50" x2="50" y2="500" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="50" y1="500" x2="750" y2="500" stroke="#1e2a3a" stroke-width="1"/>

  <!-- Candles -->
  <g stroke="#22c55e" stroke-width="2" fill="none">
    <line x1="80" y1="350" x2="80" y2="300"/>
    <rect x="70" y="320" width="20" height="30" fill="#22c55e"/>
  </g>

  <g stroke="#ef4444" stroke-width="2" fill="none">
    <line x1="120" y1="320" x2="120" y2="380"/>
    <rect x="110" y="340" width="20" height="30" fill="#ef4444"/>
  </g>

  <g stroke="#22c55e" stroke-width="2" fill="none">
    <line x1="160" y1="360" x2="160" y2="280"/>
    <rect x="150" y="310" width="20" height="30" fill="#22c55e"/>
  </g>

  <!-- EMA Lines -->
  <polyline points="50,300 100,280 150,260 200,240 250,230 300,220" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <polyline points="50,320 100,310 150,290 200,270 250,260 300,250" stroke="#a78bfa" stroke-width="2" fill="none"/>

  <!-- Volume Bars -->
  <rect x="70" y="480" width="15" height="15" fill="#22c55e" opacity="0.6"/>
  <rect x="110" y="470" width="15" height="25" fill="#ef4444" opacity="0.6"/>
  <rect x="150" y="485" width="15" height="10" fill="#22c55e" opacity="0.6"/>

  <!-- RSI -->
  <circle cx="700" cy="200" r="50" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <text x="700" y="210" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="bold">RSI</text>
  <text x="700" y="235" text-anchor="middle" fill="#3b82f6" font-size="12">68.2</text>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Gelişmiş Grafik Göstergeleri</text>
</svg>