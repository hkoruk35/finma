<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030073;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Phone Frame -->
  <rect x="150" y="80" width="200" height="380" fill="none" stroke="#1e2a3a" stroke-width="3" rx="20"/>
  <rect x="160" y="95" width="180" height="350" fill="#0a0e17" rx="15"/>

  <!-- Phone Screen Content -->
  <!-- Toolbar -->
  <rect x="160" y="95" width="180" height="40" fill="#141924" stroke="#1e2a3a" stroke-width="1"/>
  <text x="250" y="120" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="bold">CVS</text>

  <!-- Compact Chart -->
  <polyline points="165,160 175,150 185,145 195,155 205,140 215,160" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <rect x="170" y="170" width="3" height="15" fill="#22c55e" opacity="0.6"/>
  <rect x="180" y="172" width="3" height="13" fill="#22c55e" opacity="0.6"/>
  <rect x="190" y="165" width="3" height="20" fill="#ef4444" opacity="0.6"/>
  <rect x="200" y="168" width="3" height="17" fill="#22c55e" opacity="0.6"/>

  <!-- Indicator Buttons -->
  <rect x="162" y="200" width="50" height="20" fill="#3b82f6" rx="3" opacity="0.7"/>
  <text x="187" y="212" text-anchor="middle" fill="white" font-size="8" font-weight="bold">EMA</text>

  <rect x="217" y="200" width="50" height="20" fill="none" stroke="#1e2a3a" stroke-width="1" rx="3"/>
  <text x="242" y="212" text-anchor="middle" fill="white/60" font-size="8">RSI</text>

  <!-- Info Box -->
  <rect x="162" y="240" width="170" height="70" fill="#0d1117" stroke="#1e2a3a" stroke-width="1" rx="4"/>
  <text x="165" y="253" fill="#3b82f6" font-size="9" font-weight="bold">GİRİŞ</text>
  <text x="165" y="265" fill="white" font-size="10" font-weight="bold">$105.96-$107.72</text>

  <text x="165" y="285" fill="#ef4444" font-size="9" font-weight="bold">STOP</text>
  <text x="165" y="297" fill="white" font-size="10" font-weight="bold">$102.10</text>

  <!-- Right Side - Desktop View -->
  <!-- Desktop Chart Section -->
  <g opacity="0.6">
    <rect x="420" y="100" width="320" height="300" fill="none" stroke="#1e2a3a" stroke-width="1" stroke-dasharray="2,2" rx="8"/>

    <!-- Candles -->
    <line x1="450" y1="200" x2="450" y2="150"/>
    <rect x="440" y="170" width="20" height="30" fill="#22c55e" opacity="0.5"/>

    <line x1="490" y1="180" x2="490" y2="240"/>
    <rect x="480" y="190" width="20" height="30" fill="#ef4444" opacity="0.5"/>

    <line x1="530" y1="220" x2="530" y2="120"/>
    <rect x="520" y="160" width="20" height="30" fill="#22c55e" opacity="0.5"/>

    <!-- Volume Bars -->
    <rect x="440" y="310" width="12" height="20" fill="#22c55e" opacity="0.3"/>
    <rect x="480" y="305" width="12" height="25" fill="#ef4444" opacity="0.3"/>
    <rect x="520" y="312" width="12" height="18" fill="#22c55e" opacity="0.3"/>

    <text x="550" y="220" fill="white/40" font-size="10">Masaüstü</text>
  </g>

  <!-- Arrow showing responsive transition -->
  <path d="M 380 280 Q 400 280 420 280" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <polygon points="420,280 410,275 410,285" fill="#3b82f6"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Mobil Uyumlu Deneyim</text>
</svg>