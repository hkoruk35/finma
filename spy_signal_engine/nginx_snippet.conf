# Append this location block INSIDE the existing HTTPS `server { }` block
# at /etc/nginx/sites-available/bogastock.com (do not create a new server
# block). Proxies ONLY the WebSocket upgrade path to the local
# spy-signal-engine systemd service (127.0.0.1:8787, not publicly bound).
#
# Auth model: this path is OUTSIDE Next.js/proxy.ts entirely, so nginx
# cannot check the boga_auth cookie here. Instead the FastAPI app itself
# requires a `?token=` query param matching SPY_ENGINE_SECRET (shared
# secret, set identically in spy_signal_engine/.env and the frontend's
# server-only SPY_ENGINE_SECRET env var). The browser only ever learns
# this token via GET /api/admin/spyengine/live-token, a Next.js route that
# itself enforces boga_auth — so an unauthenticated visitor can reach this
# nginx location but the FastAPI app will reject the WS handshake (close
# code 4401) without a valid token. Do not widen this location to a
# prefix match (`/admin/spyengine/live/`) — /history is intentionally NOT
# exposed here; it's served by a Next.js API route that calls the engine
# over localhost instead (see frontend/app/api/admin/spyengine/live-history).

location = /admin/spyengine/live/ws {
    proxy_pass http://127.0.0.1:8787/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# After inserting, verify and reload:
#   nginx -t && systemctl reload nginx
