name: Market Picture Generation

on:
  # 2026-11-06 (kullanıcı talebi): günlük/saatlik piyasa analizi üretimi durduruldu, sistem yükü azaltıldı.
  # Zamanlama kaldırıldı; geri açmak için eski satırı ekleyin:  schedule: - cron: '20 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Call market picture generation endpoint
        run: |
          response=$(curl -s -w "\nHTTP_STATUS=%{http_code}" -X GET "https://bogastock.com/api/cron/generate-market-picture" \
            -H "Authorization: Bearer ${{ secrets.X_CRON_SECRET }}")
          echo "$response"
          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS=//')
          if [ "$status" != "200" ]; then
            echo "::error::Market picture generation call returned HTTP $status"
            exit 1
          fi
