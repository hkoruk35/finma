name: Swing Performance Update

on:
  schedule:
    # Every 2 hours during market hours (Mon-Fri, 14:00–22:00 UTC = 10:00-18:00 ET)
    - cron: '0 14,16,18,20,22 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-performance:
    runs-on: ubuntu-latest
    name: Update Swing Performance Prices
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run performance update
        run: python3 update_swing_performance.py

      - name: Commit and push changes
        run: |
          git config user.name "BOGA AI Bot"
          git config user.email "bot@bogastock.com"
          git add frontend/public/swing_performance.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data: Daily Performance Update $(date -u '+%Y-%m-%d') [bot]"
            git push
          fi
